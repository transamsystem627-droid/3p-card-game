<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カードドラフト - UI描画修正版</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #f0f2f5;
      color: #333;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    .main-container {
      display: flex;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    /* 左側：ドラフト領域 */
    .draft-area {
      flex: 3;
      background: #ffffff;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .player-turn-indicator {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 15px;
      padding: 10px;
      background-color: #e8f4ff;
      border-left: 5px solid #007bff;
      border-radius: 4px;
    }
    .card-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 15px;
    }
    /* 右側：獲得カード一覧 */
    .sidebar {
      flex: 1;
      background: #ffffff;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }
    .sidebar h2 {
      font-size: 1.1rem;
      border-bottom: 2px solid #ddd;
      padding-bottom: 8px;
      margin-bottom: 15px;
    }
    .drafted-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      max-height: 500px;
    }
    /* カードコンポーネント */
    .card {
      background: #fff;
      border: 2px solid #ccc;
      border-radius: 6px;
      padding: 15px;
      width: 120px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.1s;
      user-select: none;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #007bff;
    }
    .card-mini {
      background: #f8f9fa;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 0.9rem;
    }
    .empty-msg {
      color: #888;
      font-size: 0.85rem;
      font-style: italic;
    }
  </style>
</head>
<body>

  <header>
    <h1>カードドラフト</h1>
  </header>

  <div class="main-container">
    <!-- 左側: 現在のターンとプール -->
    <main class="draft-area">
      <div id="player-indicator" class="player-turn-indicator">
        <!-- JSで描画 -->
      </div>
      <h3>ピック可能なカード:</h3>
      <div id="card-pool" class="card-pool">
        <!-- JSで描画 -->
      </div>
    </main>

    <!-- 右側: 現在の操作プレイヤーが獲得したカード一覧 -->
    <aside class="sidebar">
      <h2 id="sidebar-title">獲得カード一覧</h2>
      <div id="drafted-list" class="drafted-list">
        <!-- JSで描画 -->
      </div>
    </aside>
  </div>

  <script>
    // --- ゲームデータモデル ---
    const state = {
      currentPlayerIndex: 0,
      players: [
        { id: 1, name: "プレイヤー 1", draftedCards: [] },
        { id: 2, name: "プレイヤー 2", draftedCards: [] },
        { id: 3, name: "プレイヤー 3", draftedCards: [] },
        { id: 4, name: "プレイヤー 4", draftedCards: [] }
      ],
      pool: [
        { id: 101, name: "剣" },
        { id: 102, name: "盾" },
        { id: 103, name: "魔法の杖" },
        { id: 104, name: "ポーション" },
        { id: 105, name: "指輪" },
        { id: 106, name: "鎧" },
        { id: 107, name: "弓" },
        { id: 108, name: "靴" }
      ]
    };

    // --- 描画関数群 ---

    // 1. 全体UIの更新
    function render() {
      renderTurnIndicator();
      renderPool();
      renderDraftedList();
    }

    // 2. ターンインジケーター描画
    function renderTurnIndicator() {
      const activePlayer = state.players[state.currentPlayerIndex];
      const indicatorEl = document.getElementById("player-indicator");
      indicatorEl.textContent = `現在の手番: ${activePlayer.name}`;
    }

    // 3. カードプール描画
    function renderPool() {
      const poolEl = document.getElementById("card-pool");
      poolEl.innerHTML = "";

      if (state.pool.length === 0) {
        poolEl.innerHTML = "<p>プールにカードがありません (ドラフト終了)</p>";
        return;
      }

      state.pool.forEach(card => {
        const cardDiv = document.createElement("div");
        cardDiv.className = "card";
        cardDiv.textContent = card.name;
        cardDiv.onclick = () => pickCard(card.id);
        poolEl.appendChild(cardDiv);
      });
    }

    /**
     * 4. 右側の獲得カード一覧描画（バグ修正箇所）
     * 
     * 【修正前（問題のコード）】
     * const activePlayer = state.players[0]; // P1に固定化されていた
     * 
     * 【修正後】
     * 現在の手番である currentPlayerIndex を動的に参照する。
     */
    function renderDraftedList() {
      // 現在操作中（ターン中）のプレイヤーを動的に取得
      const activePlayer = state.players[state.currentPlayerIndex];
      
      const sidebarTitleEl = document.getElementById("sidebar-title");
      const draftedListEl = document.getElementById("drafted-list");

      // サイドバーのタイトルを「○○ の獲得カード」と明示
      sidebarTitleEl.textContent = `${activePlayer.name} の獲得カード`;
      draftedListEl.innerHTML = "";

      if (activePlayer.draftedCards.length === 0) {
        draftedListEl.innerHTML = '<span class="empty-msg">まだ獲得したカードはありません</span>';
        return;
      }

      activePlayer.draftedCards.forEach(card => {
        const item = document.createElement("div");
        item.className = "card-mini";
        item.textContent = card.name;
        draftedListEl.appendChild(item);
      });
    }

    // --- ロジック関数 ---

    // カードをピックした際の処理
    function pickCard(cardId) {
      const cardIndex = state.pool.findIndex(c => c.id === cardId);
      if (cardIndex === -1) return;

      // 1. プールからカードを取り出す
      const [pickedCard] = state.pool.splice(cardIndex, 1);

      // 2. 現在の手番プレイヤーの配列に追加
      const activePlayer = state.players[state.currentPlayerIndex];
      activePlayer.draftedCards.push(pickedCard);

      // 3. 手番を次のプレイヤーへ（ローテーション）
      state.currentPlayerIndex = (state.currentPlayerIndex + 1) % state.players.length;

      // 4. 画面を再描画（これで右側の表示も新プレイヤーのものに更新される）
      render();
    }

    // 初期化実行
    window.addEventListener("DOMContentLoaded", () => {
      render();
    });
  </script>
</body>
</html>
