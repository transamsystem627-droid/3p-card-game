<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3人マルチプレイ カードゲーム</title>
  <!-- PeerJSの読み込み -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text);
      font-family: sans-serif;
      user-select: none;
    }
    .container { max-width: 900px; margin: 0 auto; }
    
    /* ロビー画面のスタイル */
    #lobby-screen {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .input-group { margin: 15px 0; }
    input[type="text"] {
      padding: 10px;
      width: 60%;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { background: #64748b; cursor: not-allowed; }

    /* ゲーム画面のスタイル */
    #game-screen { display: none; }
    .status-bar {
      display: flex;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 10px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .board-area {
      position: relative;
      height: 400px;
      background: #1e293b80;
      border: 2px dashed #334155;
      border-radius: 12px;
      overflow: hidden;
    }
    .card {
      width: 80px;
      height: 120px;
      background: #3b82f6;
      border: 2px solid #fff;
      border-radius: 8px;
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: grab;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .card:active { cursor: grabbing; }
    .card.tapped { transform: rotate(90deg); }
  </style>
</head>
<body>

<div class="container">
  <!-- 1. ロビー画面 -->
  <div id="lobby-screen">
    <h2>🎮 3人オンライン対戦ロビー</h2>
    <p>あなたのID: <b id="my-peer-id" style="color:var(--accent);">ID発行中...</b></p>
    
    <div style="margin: 20px 0;">
      <button id="btn-create" onclick="createRoom()">ホストとして部屋を作成</button>
    </div>
    
    <p>または</p>
    
    <div class="input-group">
      <input type="text" id="host-id-input" placeholder="ホストのIDを入力">
      <button onclick="joinRoom()">参加する</button>
    </div>

    <div id="lobby-status" style="margin-top:20px; color:#94a3b8;">接続を待機しています...</div>
  </div>

  <!-- 2. ゲームメイン画面 -->
  <div id="game-screen">
    <div class="status-bar">
      <div>プレイヤー: <span id="player-role" style="color:var(--accent);">-</span></div>
      <div>フェーズ: <span id="game-phase">ドラフト進行中</span></div>
    </div>

    <!-- 盤面エリア（ドラッグ同期用） -->
    <div class="board-area" id="board-area">
      <!-- カードが動的に生成されます -->
    </div>
  </div>
</div>

<script>
  let peer = new Peer();
  let myId = '';
  let isHost = false;
  let myPlayerIndex = 0;
  let connections = [];
  let hostConnection = null;

  peer.on('open', (id) => {
    myId = id;
    document.getElementById('my-peer-id').innerText = id;
  });

  function createRoom() {
    isHost = true;
    myPlayerIndex = 0;
    document.getElementById('btn-create').disabled = true;
    document.getElementById('lobby-status').innerText = 'ゲストの接続を待っています... (1/3)';
  }

  function joinRoom() {
    const hostId = document.getElementById('host-id-input').value.trim();
    if (!hostId) return alert('ホストのIDを入力してください');

    isHost = false;
    hostConnection = peer.connect(hostId);
    
    hostConnection.on('open', () => {
      document.getElementById('lobby-status').innerText = 'ホストへ接続しました。他のプレイヤーを待っています...';
      setupConnection(hostConnection);
    });
  }

  peer.on('connection', (conn) => {
    if (!isHost) return;

    connections.push(conn);
    const assignedIndex = connections.length;
    
    setupConnection(conn);

    conn.send({
      type: 'INIT_PLAYER',
      payload: { playerIndex: assignedIndex }
    });

    document.getElementById('lobby-status').innerText = `ゲストが接続しました (${connections.length + 1}/3)`;

    if (connections.length === 2) {
      setTimeout(startGame, 1000);
    }
  });

  function setupConnection(conn) {
    conn.on('data', (data) => {
      handleNetworkMessage(data);
    });
  }

  function broadcastData(data) {
    if (isHost) {
      handleNetworkMessage(data);
      connections.forEach(conn => conn.send(data));
    } else {
      if (hostConnection) hostConnection.send(data);
    }
  }

  function handleNetworkMessage(data) {
    switch (data.type) {
      case 'INIT_PLAYER':
        myPlayerIndex = data.payload.playerIndex;
        break;

      case 'START_GAME':
        document.getElementById('lobby-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        document.getElementById('player-role').innerText = `P${myPlayerIndex + 1}`;
        initBoard();
        break;

      case 'MOVE_CARD':
        updateCardPosition(data.payload.cardId, data.payload.x, data.payload.y);
        break;

      case 'TAP_CARD':
        toggleCardTapLocal(data.payload.cardId);
        break;
    }
  }

  function startGame() {
    broadcastData({ type: 'START_GAME' });
  }

  function initBoard() {
    const board = document.getElementById('board-area');
    board.innerHTML = '';

    for (let i = 1; i <= 3; i++) {
      createCardElement(`card-${i}`, `C-${i}`, 50 + i * 100, 100);
    }
  }

  function createCardElement(id, text, initialX, initialY) {
    const board = document.getElementById('board-area');
    const card = document.createElement('div');
    card.className = 'card';
    card.id = id;
    card.innerText = text;
    card.style.left = `${initialX}px`;
    card.style.top = `${initialY}px`;

    card.addEventListener('dblclick', () => {
      broadcastData({
        type: 'TAP_CARD',
        payload: { cardId: id }
      });
    });

    let isDragging = false;
    let offsetX, offsetY;

    card.addEventListener('mousedown', (e) => {
      isDragging = true;
      offsetX = e.clientX - card.offsetLeft;
      offsetY = e.clientY - card.offsetTop;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const x = e.clientX - offsetX;
      const y = e.clientY - offsetY;
      
      card.style.left = `${x}px`;
      card.style.top = `${y}px`;
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        broadcastData({
          type: 'MOVE_CARD',
          payload: { cardId: id, x: parseInt(card.style.left), y: parseInt(card.style.top) }
        });
      }
    });

    board.appendChild(card);
  }

  function updateCardPosition(cardId, x, y) {
    const card = document.getElementById(cardId);
    if (card) {
      card.style.left = `${x}px`;
      card.style.top = `${y}px`;
    }
  }

  function toggleCardTapLocal(cardId) {
    const card = document.getElementById(cardId);
    if (card) {
      card.classList.toggle('tapped');
    }
  }
</script>

</body>
</html>
